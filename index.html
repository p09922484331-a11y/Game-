<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1040">
<title>کلمه‌یاب</title>
<style>
:root{--teal:#2ee6c5;--gold:#ffd166;--pink:#ff5d8f;--ink:#2b1763}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,'Vazirmatn',system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,#4b2a9a 0,transparent 45%),radial-gradient(circle at 85% 90%,#0e7490 0,transparent 40%),linear-gradient(160deg,#1b1145,#2a1465 55%,#14304f);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px);z-index:2}
.screen.active{display:flex}
#bgl{position:fixed;inset:0;overflow:hidden;z-index:1;pointer-events:none}
#bgl span{position:absolute;bottom:-60px;font-weight:800;color:rgba(255,255,255,.07);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(40deg)}}
/* home */
#home{align-items:center;justify-content:safe center;text-align:center;gap:12px;overflow:auto}
.logo{display:flex;gap:6px;direction:rtl;margin-bottom:6px}
.logo b{width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,#fff,#e4dcff);color:var(--ink);font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #7c5cd6,0 14px 24px rgba(0,0,0,.35);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.sub{opacity:.8;font-size:14px;margin-bottom:10px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 16px;font-weight:700;backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:8px}
.big{width:min(280px,80vw);padding:18px;border-radius:22px;font-size:22px;font-weight:800;background:linear-gradient(180deg,#43f0cf,#12b8a0);box-shadow:0 7px 0 #0b7f70,0 14px 24px rgba(0,0,0,.35);color:#073b34;transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #0b7f70}
.mid{width:min(280px,80vw);padding:14px;border-radius:18px;font-size:17px;font-weight:700;background:linear-gradient(180deg,#ffdf8a,#f5b73a);box-shadow:0 5px 0 #b57a0f;color:#5a3a00}
.mid.alt{background:linear-gradient(180deg,#9a7cff,#6b49e0);box-shadow:0 5px 0 #43299c;color:#fff}
.mid:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
.dot{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
/* game */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ib{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.14);font-size:20px}
.lv{font-weight:800;font-size:17px}
.coins{background:rgba(0,0,0,.28);border-radius:999px;padding:7px 12px;font-weight:800;display:flex;gap:6px;align-items:center}
.coins i{background:var(--teal);color:#073b34;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.14);margin:10px 4px;overflow:hidden}
#progbar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .4s;border-radius:9px}
.words{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px 16px;padding:6px;overflow:auto;--bx:34px}
.w{display:flex;gap:4px}
.bx{width:var(--bx);height:var(--bx);border-radius:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--bx)*.58);color:transparent}
.bx.ok{background:linear-gradient(145deg,var(--teal),#14b8a6);color:#fff;border-color:transparent}
.bx.hint{background:rgba(255,209,102,.9);color:#5a3a00;border-color:transparent}
.w.pop .bx{animation:pop .45s both}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.preview{height:46px;display:flex;align-items:center;justify-content:center}
.preview span{background:rgba(0,0,0,.35);padding:6px 22px;border-radius:999px;font-size:26px;font-weight:800;min-width:60px;text-align:center;opacity:0;transform:scale(.8);transition:.12s}
.preview span.show{opacity:1;transform:scale(1)}
.preview span.good{background:var(--teal);color:#073b34}
.preview span.bad{background:var(--pink);animation:shake .35s}
.preview span.info{background:var(--gold);color:#5a3a00}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wheelwrap{display:flex;justify-content:center;padding:4px 0 8px}
#wheel{position:relative;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.06));border:2px solid rgba(255,255,255,.16);touch-action:none;box-shadow:inset 0 0 30px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.3)}
#lines{position:absolute;inset:0;pointer-events:none}
.lt{position:absolute;border-radius:50%;background:linear-gradient(145deg,#fff,#e9e1ff);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 4px 0 #a893ea,0 8px 14px rgba(0,0,0,.3);transition:transform .12s,background .12s;pointer-events:none;animation:in .4s both}
@keyframes in{from{transform:scale(0)}}
.lt.on{background:linear-gradient(145deg,var(--teal),#14b8a6);color:#fff;transform:scale(1.15);box-shadow:0 4px 0 #0b7f70}
.tools{display:flex;justify-content:center;gap:12px;padding-top:4px}
.tl{position:relative;width:78px;padding:10px 4px 8px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tl span{font-size:11px;opacity:.9}
.tl em{position:absolute;top:-8px;left:-6px;background:var(--gold);color:#5a3a00;font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.tl:active{transform:scale(.94)}
.grid2{width:min(300px,90vw);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mid.sm{width:100%;font-size:14px;padding:12px 4px;position:relative}
.mapgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start;padding:14px 4px}
.lvb{aspect-ratio:1;border-radius:18px;background:linear-gradient(180deg,#43f0cf,#12b8a0);box-shadow:0 5px 0 #0b7f70;color:#073b34;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;gap:2px}
.lvb b{font-size:20px}.lvb span{font-size:10px}
.lvb.now{background:linear-gradient(180deg,#ffdf8a,#f5b73a);box-shadow:0 5px 0 #b57a0f;color:#5a3a00;animation:pulse 1.4s infinite}
.lvb.lock{background:rgba(255,255,255,.12);box-shadow:none;color:#fff;opacity:.6}
.spinner{font-size:80px;margin:14px 0}
.spinner.go{animation:spin 1.6s cubic-bezier(.2,.8,.3,1)}
@keyframes spin{to{transform:rotate(1080deg)}}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid #fff6;display:inline-block}
.cityrow{text-align:center;font-size:13px;opacity:.9;margin-top:2px;min-height:18px}
.bn{height:16px;text-align:center;font-size:12px;color:var(--gold)}
.chip2{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-weight:700;font-size:16px}
.timed .words{align-content:flex-start;gap:8px}
.timed .tl.h{display:none}
.chh{grid-column:1/-1;font-weight:800;font-size:15px;margin-top:8px;opacity:.95}
.inp{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:20px;text-align:center;margin:8px 0;font-family:inherit;direction:ltr;user-select:text;-webkit-user-select:text}
/* چرخ شانس فانتزی */
.fw{position:relative;width:290px;height:290px;margin:22px auto 16px;direction:ltr}
.fw .aura{position:absolute;inset:-26px;border-radius:50%;background:repeating-conic-gradient(rgba(255,214,120,.34) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,transparent 52%,#000 58%,transparent 71%);mask:radial-gradient(circle,transparent 52%,#000 58%,transparent 71%);animation:auraSpin 24s linear infinite}
@keyframes auraSpin{to{transform:rotate(360deg)}}
.fw .glow{position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 34px 6px rgba(255,200,90,.55),0 0 80px 14px rgba(154,124,255,.45);animation:glowP 2.4s ease-in-out infinite}
@keyframes glowP{50%{opacity:.55}}
.fw .rim{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff4b8,#f5b73a,#9a5f08,#ffe38a,#f5b73a,#8a5206,#ffe9a0,#f5b73a,#fff4b8);box-shadow:0 10px 28px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.55),inset 0 0 12px rgba(80,40,0,.6)}
.fw .disc{position:absolute;inset:17px;border-radius:50%;box-shadow:inset 0 0 0 3px #7a4a06,inset 0 0 26px rgba(0,0,0,.55);overflow:hidden}
.fw .disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.38),transparent 46%),radial-gradient(circle,transparent 55%,rgba(0,0,0,.3));pointer-events:none}
.fw .sep{position:absolute;left:50%;top:50%;width:3px;height:128px;margin:-128px 0 0 -1.5px;transform-origin:50% 100%;background:linear-gradient(180deg,#ffe9a0,#c98a12);opacity:.9;border-radius:2px}
.fw .bl{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff6c8;box-shadow:0 0 8px 2px #ffd166;animation:blink 1.2s steps(1) infinite}
.fw .bl:nth-child(even){animation-delay:.6s}
@keyframes blink{50%{background:#8a5a10;box-shadow:none}}
.fw .lb{position:absolute;left:50%;top:50%;width:54px;margin-left:-27px;height:112px;margin-top:-112px;transform-origin:50% 100%;text-align:center;color:#fff;font-weight:800;font-size:19px;line-height:1.05;text-shadow:0 2px 4px #000a;padding-top:10px;transition:color .1s}
.fw .lb small{display:block;font-size:12px;margin-top:2px}
.fw .lb.big{font-size:24px;color:#fff3b0}
.fw .lb.big::before{content:"👑";display:block;font-size:14px;margin-bottom:-2px}
.fw .lb.cur{color:#fff3b0;text-shadow:0 0 10px #ffd166,0 0 18px #ffd166}
.fw .lb.hit{color:#fff;text-shadow:0 0 12px #fff,0 0 24px #ffd166,0 0 36px #ff5d8f;animation:hitP .5s ease-in-out infinite alternate}
@keyframes hitP{to{transform:var(--r) scale(1.18)}}
.fw .nd{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.7))}
.fw .nd::before{content:"";position:absolute;left:50%;top:22px;width:26px;height:126px;margin-left:-13px;background:linear-gradient(90deg,#8a5206 0,#ffe9a0 38%,#fff 50%,#e0a21e 62%,#8a5206 100%);clip-path:polygon(50% 0,100% 74%,50% 100%,0 74%)}
.fw .nd::after{content:"";position:absolute;left:50%;top:18px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 5px #ff5d8f,0 0 22px 8px #ffd166}
.fw .hub{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd1e6,#ff5d8f 45%,#7a1244);border:5px solid #f5b73a;box-shadow:0 0 0 2px #7a4a06,0 3px 10px #000a,0 0 16px 2px rgba(255,93,143,.7)}
.fw .sp{position:absolute;font-size:18px;animation:tw 1.8s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
/* قفل صفحه و دکمه‌ی کوچک چرخ */
html,body{position:fixed;inset:0;width:100%;overscroll-behavior:none;touch-action:manipulation}
#mbox{overflow-x:hidden;overscroll-behavior:contain}
.words,.mapgrid,#home{overflow-x:hidden;overscroll-behavior:contain}
.screen{overflow-x:hidden}
#mbox.nosc{overflow:hidden}
.big.sbtn{display:block;width:160px;margin:0 auto;padding:10px 12px;border-radius:16px;font-size:16px;box-shadow:0 4px 0 #0b7f70,0 8px 14px rgba(0,0,0,.3)}
.buy.locked{opacity:.55;filter:grayscale(.5)}
.credit{margin-top:auto;padding-top:6px;font-size:12px;opacity:.55;letter-spacing:.2px}
.big.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b7f70}
@media (max-height:700px){.nosc .fw{transform:scale(.82);margin:-14px auto -6px}}
@media (max-height:600px){.nosc .fw{transform:scale(.68);margin:-34px auto -20px}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,2,20,.65);display:none;align-items:center;justify-content:center;z-index:10;padding:18px;backdrop-filter:blur(4px)}
#modal.open{display:flex}
#mbox{width:min(360px,100%);max-height:88vh;overflow:auto;background:linear-gradient(160deg,#3a1f8a,#25125f);border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:22px 18px;text-align:center;animation:pop .35s both;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#mbox h2{font-size:24px;margin-bottom:8px}
#mbox p{opacity:.85;line-height:1.9;font-size:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;margin:8px 0;text-align:right}
.row b{font-size:16px}.row small{opacity:.75;display:block;font-size:12px}
.buy{background:linear-gradient(180deg,#43f0cf,#12b8a0);color:#073b34;font-weight:800;border-radius:12px;padding:9px 14px;white-space:nowrap}
.tag{background:var(--pink);font-size:11px;padding:2px 8px;border-radius:999px;margin-right:6px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.day{border-radius:12px;background:rgba(255,255,255,.12);padding:10px 0;font-size:12px}
.day b{display:block;font-size:17px;color:var(--gold);margin:2px 0}
.day.jp{border:2px solid var(--gold);background:linear-gradient(160deg,rgba(255,209,102,.35),rgba(255,93,143,.25))}
.day.now{background:var(--gold);color:#5a3a00}.day.now b{color:#5a3a00}
.day.past{opacity:.45}
.close{margin-top:10px;background:transparent;color:#fff;opacity:.75;padding:8px;font-size:14px}
.switch{width:52px;height:30px;border-radius:99px;background:#555;position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--teal)}.switch.on::after{right:25px}
.stars{font-size:38px;letter-spacing:6px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(30px);background:#000c;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:15}
</style>
</head>
<body>
<div id="bgl"></div>

<section id="home" class="screen active">
  <div class="logo" id="logo"></div>
  <div class="sub">کلمه‌ها را از میان حرف‌ها پیدا کن!</div>
  <div class="chip">🪙 <span id="coinsH"></span> &nbsp; ⭐ <span id="starsH"></span></div>
  <button class="big" id="playBtn" onclick="play()"></button>
  <div class="grid2">
    <button class="mid sm" style="grid-column:span 2;background:linear-gradient(180deg,#ff8fb1,#ff5d8f);box-shadow:0 5px 0 #a42e55;color:#fff" onclick="openTimed()">⏱ چالش زمان‌دار با دوستان</button>
    <button class="mid sm" onclick="openMap()">🗺️ مراحل</button>
    <button class="mid sm" onclick="openMissions()">🎯 ماموریت‌ها<span class="dot" id="missDot" style="display:none">!</span></button>
    <button class="mid sm" onclick="openDaily(true)">🎁 جایزه روزانه<span class="dot" id="dailyDot" style="display:none">!</span></button>
    <button class="mid sm" onclick="openSpin()">🎡 چرخ شانس<span class="dot" id="spinDot" style="display:none">!</span></button>
    <button class="mid sm alt" onclick="openShop()">🛒 فروشگاه سکه</button>
    <button class="mid sm alt" onclick="openThemes()">🎨 پوسته‌ها</button>
    <button class="mid sm alt" onclick="openAchievements()">🏆 افتخارات و آمار</button>
    <button class="mid sm alt" onclick="openTutorial(true)">📖 راهنمای بازی</button>
    <button class="mid sm alt" style="grid-column:span 2" onclick="openSettings()">⚙️ تنظیمات</button>
  </div>
  <div class="credit">سازنده: پارسا رضایی</div>
</section>

<section id="game" class="screen">
  <div class="top">
    <button class="ib" onclick="goHome()">🏠</button>
    <div class="lv" id="lvbox">مرحله <span id="lvn"></span></div>
    <div class="lv" id="tbox" style="display:none">⏱ <span id="tm">۶۰</span> · ⭐ <span id="sc">۰</span></div>
    <div class="coins" onclick="openShop()">🪙 <b id="coinsG"></b><i>+</i></div>
  </div>
  <div class="cityrow" id="city"></div>
  <div class="prog"><div id="progbar"></div></div>
  <div class="bn" id="bn"></div>
  <div class="words" id="words"></div>
  <div class="preview"><span id="preview"></span></div>
  <div class="wheelwrap">
    <div id="wheel"><svg id="lines"><polyline id="pl" fill="none" stroke="rgba(46,230,197,.75)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="tools">
    <button class="tl" onclick="shuffle()">🔀<span>بُر زدن</span></button>
    <button class="tl h" onclick="hint()">💡<span>راهنما</span><em id="c1"></em></button>
    <button class="tl h" onclick="revealWord()">🔍<span>کشف کلمه</span><em id="c2"></em></button>
  </div>
</section>

<section id="map" class="screen">
  <div class="top">
    <button class="ib" onclick="goHome()">🏠</button>
    <div class="lv">مراحل</div>
    <div class="coins">⭐ <b id="starsM"></b></div>
  </div>
  <div class="mapgrid" id="mapgrid"></div>
</section>

<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<canvas id="cf"></canvas>

<script>
/* ============ تنظیمات قابل ویرایش ============ */
const HINT_COST = 20, REVEAL_COST = 50;
const DAILY = [5, 8, 10, 15, 20, 25, 50, 100];   // ۸ روز؛ روز هشتم جایزه‌ی بزرگ
const SPIN = [8,12,15,20,30,45,70,100];        // گزینه‌های چرخ (بیشترین جایزه ۱۰۰ سکه)
const SPIN_W = [24,22,18,14,10,7,4,1];       // شانس هر گزینه؛ میانگین جایزه حدود ۲۰ سکه
const MISSIONS = [
  {k:'words',  goal:15, reward:6,  text:'۱۵ کلمه پیدا کن'},
  {k:'levels', goal:2,  reward:8,  text:'۲ مرحله را تمام کن'},
  {k:'clean',  goal:1,  reward:10, text:'یک مرحله را بدون راهنما تمام کن'}
];
const THEMES = [
  {id:'d', name:'بنفش شبانه', price:0,   base:'#1a1040', bg:'radial-gradient(circle at 20% 10%,#4b2a9a 0,transparent 45%),radial-gradient(circle at 85% 90%,#0e7490 0,transparent 40%),linear-gradient(160deg,#1b1145,#2a1465 55%,#14304f)'},
  {id:'s', name:'غروب',       price:80,  base:'#4a1033', bg:'radial-gradient(circle at 20% 10%,#c2410c 0,transparent 45%),radial-gradient(circle at 85% 90%,#be185d 0,transparent 40%),linear-gradient(160deg,#4a1033,#7c2d12 55%,#431407)'},
  {id:'f', name:'جنگل',       price:120, base:'#052e16', bg:'radial-gradient(circle at 20% 10%,#15803d 0,transparent 45%),radial-gradient(circle at 85% 90%,#0f766e 0,transparent 40%),linear-gradient(160deg,#052e16,#14532d 55%,#064e3b)'},
  {id:'o', name:'اقیانوس',    price:120, base:'#0c1a3a', bg:'radial-gradient(circle at 20% 10%,#0369a1 0,transparent 45%),radial-gradient(circle at 85% 90%,#1d4ed8 0,transparent 40%),linear-gradient(160deg,#0c1a3a,#0c4a6e 55%,#172554)'},

let ac;
function beep(f, d, type='sine', v=.14, delay=0){
  if(!S.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}

function canScrollY(el){ const cs = getComputedStyle(el); return /(auto|scroll)/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 1; }

  e.preventDefault();
}, {passive:false});

function today(){ return new Date().toDateString(); }
function dailyReady(){ return S.lastDaily !== today(); }
function nextStreak(){
  const y = new Date(); y.setDate(y.getDate()-1);
  return S.lastDaily === y.toDateString() ? (S.streak % DAILY.length) + 1 : 1;
}
function openDaily(manual){
  const ready = dailyReady();
  if(!ready && !manual) return;
  const st = ready ? nextStreak() : S.streak;
  let days = '';
  for(let i=1;i<=DAILY.length;i++){
    days += `<div class="day ${i===st?'now':(i<st?'past':'')}${i===DAILY.length?' jp':''}">روز ${fa(i)}<b>${fa(DAILY[i-1])}</b>${i===DAILY.length?'💎':'🪙'}</div>`;
  }
  openModal(`<h2>🎁 جایزه روزانه</h2><p>هر روز بیای جایزه‌ات بزرگ‌تر می‌شود!</p><div class="days">${days}</div>`+
    (ready ? `<button class="big" style="width:100%" onclick="claimDaily()">دریافت ${fa(DAILY[st-1])} سکه</button>`
           : `<p>جایزه امروز را گرفته‌ای. فردا دوباره بیا!</p>`) +
    `<button class="close" onclick="closeModal()">بستن</button>`);
}
function claimDaily(){
  const st = nextStreak();
  S.streak = st; S.lastDaily = today(); addCoins(DAILY[st-1]);
  sfx.coin(); closeModal(); toast('🎁 ' + fa(DAILY[st-1]) + ' سکه گرفتی!');
}

const PAID_KEY = KEY + '_paid';          // جدا از پیشرفت بازی نگه داشته می‌شود تا «پاک کردن پیشرفت» رسید خریدها را پاک نکند
const Billing = {
  prices: {}, busy: false, timer: null,
  has(){ return typeof window.AndroidBilling !== 'undefined' && window.AndroidBilling !== null; },
  call(fn, ...a){ try{ return window.AndroidBilling[fn](...a); }catch(e){ return null; } },
  paid(){ try{ return JSON.parse(localStorage.getItem(PAID_KEY)) || []; }catch(e){ return []; } },
  markPaid(t){ const a = this.paid(); a.push(t); try{ localStorage.setItem(PAID_KEY, JSON.stringify(a.slice(-300))); }catch(e){} },
  init(){ if(!this.has()) return; this.call('init'); },
  setBusy(b){ this.busy = b; clearTimeout(this.timer); if(b) this.timer = setTimeout(() => { this.busy = false; this.rerender(); }, 90000); this.rerender(); },
  rerender(){ const m = $('mbox'); if($('modal').classList.contains('open') && m && m.dataset.shop === '1') openShop(); },
  buy(id){
    const p = PACKS.find(x => x.id === id); if(!p) return;
    if(!this.has()){ toast('خرید سکه فقط در برنامه‌ی نصب‌شده از مایکت ممکن است'); return; }
    if(this.busy) return;
    this.setBusy(true);
    this.call('purchase', p.sku, 'u' + Date.now());
  },
  grant(sku, token){
    const p = PACKS.find(x => x.sku === sku);
    if(p && token && !this.paid().includes(token)){
      this.markPaid(token); addCoins(p.coins); sfx.coin(); toast('✅ ' + fa(p.coins) + ' سکه به حسابت اضافه شد');
    }
    if(token) this.call('consume', token);       // محصول مصرفی: بعد از دادن سکه مصرفش می‌کنیم تا دوباره قابل خرید شود
  },
  onEvent(m){
    if(!m || !m.type) return;
    if(m.type === 'ready'){ this.call('queryProducts', JSON.stringify(PACKS.map(p => p.sku))); this.call('queryPurchases'); }
    else if(m.type === 'products'){ (m.items || []).forEach(it => { this.prices[it.sku] = it.price; }); this.rerender(); }
    else if(m.type === 'owned'){ (m.items || []).forEach(it => this.grant(it.sku, it.token)); }
    else if(m.type === 'purchased'){ this.grant(m.sku, m.token); this.setBusy(false); }
    else if(m.type === 'cancelled'){ this.setBusy(false); }
    else if(m.type === 'error'){ this.setBusy(false); toast('خرید انجام نشد. دوباره تلاش کن'); }
  }
};

/* ============ منطق بازی ============ */
let cur = null, sel = [], dragging = false;

function play(){
  show('game');
  startLevel(S.level);
}
function startLevel(i){
  clearInterval(tInt);
  const L = i < LEVELS.length ? LEVELS[i] : genLevel(i);
  const letters = Array.from(L.l);
  const words = L.w.filter(w => canForm(w, letters)).map(w => ({w, found:false, rev:Array(w.length).fill(false)}));
  words.sort((a,b)=>a.w.length-b.w.length);
  cur = {i, letters, words, hints:0, combo:0, mode:'level', bonus:new Set()};
  sel = []; dragging = false;
  $('lvn').textContent = fa(i+1);
  setMode('level');
  const ct = cityOf(i);
  $('city').textContent = '📍 ' + ct.n + ' · فصل ' + fa(Math.floor(i/10)+1);
  $('game').style.backgroundImage = 'radial-gradient(circle at 50% 0%,' + ct.c + '66,transparent 55%)';
  $('bn').textContent = '';
  buildWheel(); renderWords(); updateProg(); draw(); refresh();
}
function buildWheel(){
  const W = $('wheel');
  const size = Math.max(210, Math.min(300, innerWidth-48, innerHeight*0.36));
  W.style.width = W.style.height = size+'px';
  W.querySelectorAll('.lt').forEach(e=>e.remove());
  const n = cur.letters.length, c = size/2, ts = Math.min(56, size*.22), R = c - ts/2 - 8;
  cur.pos = [];
  cur.letters.forEach((ch,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n;
    const x = c + R*Math.cos(a), y = c + R*Math.sin(a);
    const el = document.createElement('div');
    el.className = 'lt'; el.textContent = ch;
    el.style.cssText = `width:${ts}px;height:${ts}px;left:${x-ts/2}px;top:${y-ts/2}px;font-size:${ts*.55}px;animation-delay:${i*45}ms`;
    W.appendChild(el); cur.pos.push({x,y,el});
  });
  cur.hitR = ts*.62;
  const L = $('lines'); L.setAttribute('width', size); L.setAttribute('height', size);
}
function renderWords(){
  const box = $('words'); box.innerHTML = '';
  box.style.setProperty('--bx', cur.words.length > 9 ? '29px' : '35px');
  cur.words.forEach(o=>{
    const d = document.createElement('div'); d.className = 'w' + (o.pop ? ' pop' : '');
    for(let i=0;i<o.w.length;i++){
      const b = document.createElement('span'); b.className = 'bx';
      if(o.found || o.rev[i]){ b.textContent = o.w[i]; b.classList.add(o.found ? 'ok' : 'hint'); }
      d.appendChild(b);
    }
    box.appendChild(d); o.pop = false;
  });
}
function updateProg(){
  const f = cur.words.filter(o=>o.found).length;
  $('progbar').style.width = (f / cur.words.length * 100) + '%';
}
let msgT;
function flash(text, cls){
  const p = $('preview'); p.textContent = text; p.className = 'show ' + cls;
  clearTimeout(msgT); msgT = setTimeout(()=>{ p.className = ''; }, 900);
}
function draw(){
  cur.pos.forEach((p,i)=>p.el.classList.toggle('on', sel.includes(i)));
  const pts = sel.map(i=>cur.pos[i].x + ',' + cur.pos[i].y);
  if(dragging && sel.length && cur.mx != null) pts.push(cur.mx + ',' + cur.my);
  $('pl').setAttribute('points', pts.join(' '));
  if(dragging || sel.length){
    const t = sel.map(i=>cur.letters[i]).join('');
    const p = $('preview'); clearTimeout(msgT);
    p.textContent = t; p.className = t ? 'show' : '';
  }
}
function hit(e){
  const r = $('wheel').getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  cur.mx = x; cur.my = y;
  for(let i=0;i<cur.pos.length;i++){
    const p = cur.pos[i];
    if(Math.hypot(p.x-x, p.y-y) < cur.hitR){
      if(!sel.includes(i)){ sel.push(i); sfx.tap(); vib(8); }
      else if(sel.length > 1 && sel[sel.length-2] === i){ sel.pop(); sfx.tap(); }
      break;
    }
  }
  draw();
}
const W = $('wheel');
W.addEventListener('pointerdown', e=>{ if(!cur) return; dragging = true; sel = []; try{ W.setPointerCapture(e.pointerId); }catch(_){} hit(e); });
W.addEventListener('pointermove', e=>{ if(dragging) hit(e); });
['pointerup','pointercancel'].forEach(ev => W.addEventListener(ev, ()=>{
  if(!dragging) return;
  dragging = false;
  const word = sel.map(i=>cur.letters[i]).join('');
  sel = []; draw();
  if(word.length >= 2) submit(word); else $('preview').className = '';
}));

function submit(word){
  if(cur.mode === 'time'){ timeSubmit(word); return; }
  const o = cur.words.find(x=>x.w === word);
  if(!o){
    if(word.length >= 3 && DSET.has(word)){ bonusWord(word); return; }
    cur.combo = 0; flash(word, 'bad'); sfx.bad(); vib([30,40,30]); return;
  }
  if(o.found){ flash('قبلاً پیدا شده', 'info'); sfx.bad(); return; }
  o.found = true; o.pop = true;
  cur.combo++;
  let gain = word.length >= 5 ? 2 : 1;
  let txt = '+' + fa(gain) + ' 🪙';
  if(cur.combo >= 3 && cur.combo % 3 === 0){ gain += 1; txt = 'کمبو ×' + fa(cur.combo) + ' 🔥 +' + fa(gain) + ' 🪙'; }
  S.totalWords++; addCoins(gain); mission('words', 1); checkAchievements();
  flash(txt, 'good'); sfx.ok(); vib(25);
  renderWords(); updateProg();
  if(cur.words.every(x=>x.found)) setTimeout(win, 650);
}
function shuffle(){
  if(!cur) return;
  for(let i=cur.letters.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [cur.letters[i],cur.letters[j]] = [cur.letters[j],cur.letters[i]]; }
  sel = []; buildWheel(); draw(); sfx.tap();
}
function pay(cost){
  if(S.coins < cost){ toast('سکه‌ات کافی نیست'); openShop(); return false; }
  S.coins -= cost; save(); refresh(); return true;
}
function hint(){
  const pool = cur.words.filter(o=>!o.found);
  if(!pool.length) return;
  if(!pay(HINT_COST)) return;
  const o = pool[Math.floor(Math.random()*pool.length)];
  const i = o.rev.findIndex(r=>!r);
  o.rev[i] = true; cur.hints++;
  if(o.rev.every(Boolean)){ o.found = true; o.pop = true; }
  sfx.ok(); renderWords(); updateProg();
  if(cur.words.every(x=>x.found)) setTimeout(win, 650);
}
function revealWord(){
  const pool = cur.words.filter(o=>!o.found);
  if(!pool.length) return;
  if(!pay(REVEAL_COST)) return;
  const o = pool[Math.floor(Math.random()*pool.length)];
  o.found = true; o.pop = true; cur.hints += 2;
  sfx.ok(); renderWords(); updateProg();
  if(cur.words.every(x=>x.found)) setTimeout(win, 650);
}
function win(){
  const noHint = cur.hints === 0;
  const n = noHint ? 3 : (cur.hints <= 2 ? 2 : 1);
  const first = cur.i === S.level;
  const gain = first ? 10 + (noHint ? 5 : 0) : 0;
  if(first) S.level++;
  S.stars[cur.i] = Math.max(S.stars[cur.i] || 0, n);
  if(gain) addCoins(gain); else { save(); refresh(); }
  mission('levels', 1); if(noHint) mission('clean', 1); checkAchievements();
  sfx.win(); vib([40,60,40,60,120]); confetti();
  const stars = '⭐'.repeat(n) + '☆'.repeat(3-n);
  openModal(`<h2>🎉 آفرین!</h2><div class="stars">${stars}</div>
    <p>مرحله را تمام کردی<br>${gain ? 'جایزه: <b>'+fa(gain)+'</b> 🪙' : 'سکه‌ی بیشتر در مرحله‌های جدید است'}${noHint?'<br>بدون راهنما بودی!':''}</p>
    <button class="big" style="width:100%" onclick="nextLevel()">مرحله بعد ◀</button>
    <button class="close" onclick="goHome()">منو</button>`);
}

}

/* ============ کاغذرنگی ============ */
function confetti(){
  const cv = $('cf'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#2ee6c5','#ffd166','#ff5d8f','#9a7cff','#fff'];
  const ps = Array.from({length:120}, ()=>({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.5, vx:(Math.random()-.5)*4, vy:2+Math.random()*5, s:5+Math.random()*7, r:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t = 0;
  (function f(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=.15; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(++t < 150) requestAnimationFrame(f); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

function spinReady(){ return S.spinDate !== today(); }
const SPIN_COL = ['#6d3fd6','#0f9d8f','#e07a2d','#d1357f','#2f6fe0','#1f9d57','#c9961a','#c81e4b'];
function wheelHTML(){
  const n = SPIN.length, seg = 360 / n, mx = Math.max(...SPIN);
  const stops = SPIN.map((_, i) => SPIN_COL[i % SPIN_COL.length] + ' ' + (i * seg) + 'deg ' + ((i + 1) * seg) + 'deg').join(',');
  let h = '<div class="fw"><div class="aura"></div><div class="glow"></div><div class="rim">';
  for(let i = 0; i < 18; i++) h += '<i class="bl" style="transform:rotate(' + (i * 20) + 'deg) translateY(-138px)"></i>';
  h += '</div><div class="disc" style="background:conic-gradient(from ' + (-seg / 2) + 'deg,' + stops + ')"></div>';
  for(let i = 0; i < n; i++) h += '<div class="sep" style="transform:rotate(' + ((i + .5) * seg) + 'deg)"></div>';
  SPIN.forEach((v, i) => { h += '<div class="lb' + (v === mx ? ' big' : '') + '" id="lb' + i + '" style="--r:rotate(' + (i * seg) + 'deg);transform:rotate(' + (i * seg) + 'deg)">' + fa(v) + '<small>🪙</small></div>'; });
  h += '<div class="nd" id="needle"></div><div class="hub"></div>';

  return h + '</div>';
}
function openSpin(){
  window._nd = 0;
  const ready = spinReady();
  const msg = ready ? 'روزی یک بار شانست را امتحان کن! بیشترین جایزه ' + fa(Math.max(...SPIN)) + ' سکه است.' : 'امروز چرخاندی. فردا دوباره بیا!';
  const btn = ready ? '<button class="big sbtn" id="spinBtn" onclick="doSpin()">🎡 بچرخان!</button>'
    : '';
  openModal('<h2>🎡 چرخ شانس</h2><p id="spinMsg">' + msg + '</p>' + wheelHTML() + btn + '<button class="close" onclick="closeModal()">بستن</button>');
  $('mbox').classList.add('nosc');

  if(hub){ hub.style.cursor = 'pointer'; hub.style.pointerEvents = 'auto'; hub.onclick = () => { const b = $('spinBtn'); if(b && b.style.display !== 'none') b.click(); }; }
}
const easeOutSpin = t => 1 - Math.pow(1 - t, 2.4);   // شروع سریع ولی قابل دیدن، پایان آرام
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let spinBusy = false;
function doSpin(){
  if(spinBusy) return;
  if(!spinReady()) return;
  S.spinDate = today(); save();
  spinBusy = true;
  $('spinBtn').style.display = 'none';
  const total = SPIN_W.reduce((a, b) => a + b, 0);
  let x = Math.random() * total, idx = 0;
  for(; idx < SPIN_W.length - 1; idx++){ x -= SPIN_W[idx]; if(x < 0) break; }
  const prize = SPIN[idx], n = SPIN.length, seg = 360 / n;
  const B = window._nd || 0;
  const target = B - (B % 360) + 360 * 6 + idx * seg + (Math.random() - .5) * seg * .6;
  const BACK = -16, OVER = 5, T0 = 600, T1 = 5600, T2 = 600;
  const needle = $('needle'), mbox = $('mbox');
  let last = -1, done = false, t0 = null;
  const setA = a => { needle.style.transform = 'rotate(' + a + 'deg)'; };
  const track = a => {
    const i = Math.round((((a % 360) + 360) % 360) / seg) % n;
    if(i !== last){
      last = i; sfx.tap(); vib(6);
      document.querySelectorAll('.fw .lb').forEach((e, j) => e.classList.toggle('cur', j === i));
    }
  };
  function finish(){
    if(done) return; done = true; spinBusy = false; window._nd = target;
    setA(target);
    if(needle.isConnected){
      document.querySelectorAll('.fw .lb').forEach(e => e.classList.remove('cur'));
      const l = $('lb' + idx); if(l) l.classList.add('hit');
      const p = mbox.querySelector('p'); if(p) p.innerHTML = '🎉 <b>' + fa(prize) + '</b> سکه بردی! 🪙';
    }
    addCoins(prize); sfx.win(); sfx.coin(); vib([40,60,40]); confetti();
    if(!needle.isConnected) toast('🎡 ' + fa(prize) + ' سکه از چرخ شانس گرفتی!');
  }
  function frame(ts){
    if(done) return;
    if(t0 === null) t0 = ts;
    const t = ts - t0;
    let a;
    if(t < T0){ a = B + BACK * easeInOut(t / T0); }                                   // عقب‌کشیدن برای گرفتن نیرو
    else if(t < T0 + T1){ const u = easeOutSpin((t - T0) / T1); a = B + BACK + (target + OVER - B - BACK) * u; }  // چرخش تند و کند شدن تدریجی
    else if(t < T0 + T1 + T2){ const u = easeInOut((t - T0 - T1) / T2); a = target + OVER - OVER * u; }    // کمی رد می‌شود و برمی‌گردد
    else { finish(); return; }
    setA(a); track(a);
    requestAnimationFrame(frame);
  }
  setTimeout(finish, T0 + T1 + T2 + 800);   // اگر صفحه در پس‌زمینه رفت، جایزه گم نشود
  requestAnimationFrame(frame);
}

/* ============ پوسته‌ها ============ */
function applyTheme(){
  const t = THEMES.find(x=>x.id === S.theme) || THEMES[0];
  document.body.style.background = t.bg;
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = t.base;
}
function openThemes(){
  let h = '<h2>🎨 پوسته‌ها</h2><p>ظاهر بازی را عوض کن. سکه‌هایت: <b>' + fa(S.coins) + '</b> 🪙</p>';
  THEMES.forEach(t=>{
    const own = S.themes.includes(t.id), on = S.theme === t.id;
    h += `<div class="row"><div style="display:flex;gap:10px;align-items:center"><span class="sw" style="background:${t.bg}"></span><b>${t.name}</b></div>` +
      (on ? '<span>✅ فعال</span>' : own ? `<button class="buy" onclick="useTheme('${t.id}')">انتخاب</button>` : `<button class="buy" onclick="useTheme('${t.id}')">🪙 ${fa(t.price)}</button>`) + '</div>';
  });
  h += '<button class="close" onclick="closeModal()">بستن</button>';
  openModal(h);
}
function useTheme(id){
  const t = THEMES.find(x=>x.id === id); if(!t) return;
  if(!S.themes.includes(id)){
    if(S.coins < t.price){ toast('سکه‌ات کافی نیست'); return; }
    S.coins -= t.price; S.themes.push(id); sfx.coin();
  }
  S.theme = id; save(); applyTheme(); refresh(); openThemes();
}

/* ============ مولد مرحله ============ */
function rng(seed){
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const XTRA = 'اریتنسمهد';
const BASES = DICT.filter(w => w.length >= 4 && w.length <= 7);
function genCore(r, want, minNeed){
  const pool = BASES.filter(w => w.length >= want - 1 && w.length <= want);
  const P = pool.length ? pool : BASES;
  let best = null;
  for(let t = 0; t < 150; t++){
    const letters = Array.from(P[Math.floor(r() * P.length)]);
    if(letters.length < 8 && r() < .6) letters.push(XTRA[Math.floor(r() * XTRA.length)]);
    const targets = DICT.filter(w => w.length >= 3 && canForm(w, letters));
    if(!best || targets.length > best.targets.length) best = {letters, targets};
    if(targets.length >= minNeed) break;
  }
  for(let i = best.letters.length - 1; i > 0; i--){
    const j = Math.floor(r() * (i + 1)); [best.letters[i], best.letters[j]] = [best.letters[j], best.letters[i]];
  }
  return best;
}
/* مرحله‌ی بی‌نهایت: هر شماره‌ی مرحله همیشه همان مرحله‌ی یکسان را می‌سازد؛ ترکیب حرف‌ها عملاً تمام‌نشدنی است */
const XL = 'ااریتنسمهدبکلوشخگپزرنتمد';
function targetsOf(letters){ return DICT.filter(w => w.length >= 3 && canForm(w, letters)); }
function genLevel(n){
  const r = rng(n * 7919 + 13);
  const k = n - LEVELS.length;
  const want = Math.min(7, 5 + Math.floor(k / 25));
  const total = Math.min(8, want + (k >= 100 ? 1 : 0));
  const pool = BASES.filter(w => w.length >= Math.max(4, want - 2) && w.length <= want);
  const P = pool.length ? pool : BASES;
  let best = null;
  for(let t = 0; t < 40; t++){
    const letters = Array.from(P[Math.floor(r() * P.length)]);
    while(letters.length < total) letters.push(XL[Math.floor(r() * XL.length)]);
    const targets = targetsOf(letters);
    if(!best || targets.length > best.targets.length) best = {letters, targets};
    if(targets.length >= (t < 25 ? 9 : 6)) break;
  }
  const letters = best.letters, targets = best.targets;
  for(let i = letters.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [letters[i], letters[j]] = [letters[j], letters[i]]; }
  const sh = a => a.map(v => [r(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  const long = sh(targets.filter(w => w.length >= 4)).sort((x, y) => y.length - x.length);
  const cap = Math.min(12, 6 + Math.floor(k / 30));
  const pick = long.slice(0, cap);
  const short = sh(targets.filter(w => w.length === 3));
  while(pick.length < Math.min(cap, 6) && short.length) pick.push(short.pop());
  while(pick.length < 3 && short.length) pick.push(short.pop());
  return {l: letters.join(''), w: pick};
}
function bonusWord(w){
  if(cur.bonus.has(w)){ flash('قبلاً پیدا شده', 'info'); sfx.bad(); return; }
  cur.bonus.add(w);
  let t = '✨ کلمه‌ی جایزه';
  if(cur.bonus.size <= 5){ addCoins(1); t += ' +' + fa(1) + ' 🪙'; }
  $('bn').textContent = '✨ کلمه‌ی جایزه: ' + fa(cur.bonus.size);
  flash(t, 'good'); sfx.ok(); vib(20);
}

/* ============ حالت زمان‌دار و چالش ============ */
function setMode(m){
  $('game').classList.toggle('timed', m === 'time');
  $('lvbox').style.display = m === 'time' ? 'none' : '';
  $('tbox').style.display = m === 'time' ? '' : 'none';
}
let tInt = null, shareTxt = '';
function openTimed(){
  const code = String(100000 + Math.floor(Math.random() * 900000));
  openModal(`<h2>⏱ چالش زمان‌دار</h2>
    <p>۶۰ ثانیه وقت داری تا هر چه می‌توانی کلمه‌ی ۳ حرفی یا بیشتر پیدا کنی. دوستانت با همین کد، همین حرف‌ها را می‌گیرند!</p>
    <p>بهترین امتیاز تو: <b>${fa(S.best)}</b></p>
    <button class="big" style="width:100%" onclick="startTimed('${code}')">شروع (کد ${fa(code)})</button>
    <p style="margin-top:14px">کد دوستت را داری؟</p>
    <input id="fcode" class="inp" type="tel" maxlength="6" placeholder="······">
    <button class="mid alt" style="width:100%" onclick="useCode()">شروع با این کد</button>
    <button class="close" onclick="closeModal()">بستن</button>`);
}
function useCode(){
  const v = $('fcode').value.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g, '');
  if(v.length !== 6){ toast('کد باید ۶ رقم باشد'); return; }
  startTimed(v);
}
function startTimed(code){
  closeModal(); clearInterval(tInt);
  const r = rng(parseInt(code, 10) * 31 + 7);
  const core = genCore(r, 7, 12);
  cur = {mode:'time', code, letters:core.letters, found:new Set(), score:0, left:60, combo:0, i:-1, words:[], pos:[]};
  sel = []; dragging = false;
  show('game'); setMode('time');
  $('city').textContent = '⏱ کد چالش: ' + fa(code);
  $('game').style.backgroundImage = 'radial-gradient(circle at 50% 0%,#ff5d8f66,transparent 55%)';
  $('words').innerHTML = ''; $('bn').textContent = ''; $('preview').className = '';
  $('sc').textContent = fa(0); $('tm').textContent = fa(60); $('progbar').style.width = '100%';
  buildWheel(); draw(); refresh();
  tInt = setInterval(() => {
    cur.left--;
    $('tm').textContent = fa(Math.max(0, cur.left));
    $('progbar').style.width = Math.max(0, cur.left / 60 * 100) + '%';
    if(cur.left <= 0){ clearInterval(tInt); endTimed(); }
  }, 1000);
}
function timeSubmit(word){
  if(cur.left <= 0) return;
  if(word.length < 3 || !DSET.has(word)){ flash(word, 'bad'); sfx.bad(); vib([30,40,30]); return; }
  if(cur.found.has(word)){ flash('قبلاً پیدا شده', 'info'); sfx.bad(); return; }
  cur.found.add(word);
  const pts = Math.max(1, word.length - 2);
  cur.score += pts; $('sc').textContent = fa(cur.score);
  const c = document.createElement('span'); c.className = 'chip2'; c.textContent = word;
  $('words').prepend(c);
  flash('+' + fa(pts), 'good'); sfx.ok(); vib(20);
}
function endTimed(){
  sel = []; dragging = false; draw();
  const score = cur.score, n = cur.found.size, code = cur.code;
  const newBest = score > S.best; if(newBest) S.best = score;
  if(S.tDate !== today()){ S.tDate = today(); S.tRuns = 0; }
  const reward = S.tRuns < 3 ? Math.min(5, Math.floor(score / 6)) : 0;
  S.tRuns++;
  if(reward) addCoins(reward); else { save(); refresh(); }
  if(n) mission('words', n); checkAchievements();
  shareTxt = 'در بازی «کلمه‌یاب» با کد چالش ' + fa(code) + ' امتیاز ' + fa(score) + ' گرفتم! می‌توانی بیشتر بگیری؟ کد را در بخش «چالش زمان‌دار» وارد کن.';
  sfx.win(); confetti();
  openModal(`<h2>⏱ زمان تمام شد!</h2><div class="stars">${fa(score)}</div>
    <p>${fa(n)} کلمه پیدا کردی${newBest ? '<br>🏆 رکورد جدید!' : ''}<br>${reward ? 'جایزه: <b>' + fa(reward) + '</b> 🪙' : 'سکه‌ی امروز این حالت تمام شده یا امتیاز کم بود'}</p>
    <button class="big" style="width:100%" onclick="shareRes()">📤 ارسال نتیجه به دوستان</button>
    <button class="mid alt" style="width:100%;margin-top:10px" onclick="openTimed()">دوباره</button>
    <button class="close" onclick="goHome()">منو</button>`);
}
function shareRes(){
  if(navigator.share){ navigator.share({text: shareTxt}).catch(() => {}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(shareTxt).then(() => toast('متن کپی شد؛ برای دوستت بفرست')).catch(() => toast(shareTxt)); }
  else toast(shareTxt);
}

/* ============ آموزش ============ */
function openTutorial(manual){
  openModal(`<h2>${manual ? '📖 راهنمای بازی' : '👋 خوش آمدی!'}</h2>
    <div class="row"><b>۱</b><div style="flex:1">انگشتت را روی حرف‌ها بکش تا کلمه بسازی</div></div>
    <div class="row"><b>۲</b><div style="flex:1">کلمه‌ی درست در جدول بالا می‌نشیند و سکه می‌گیری</div></div>
    <div class="row"><b>۳</b><div style="flex:1">کلمه‌ی معنی‌دار بیرون از جدول هم «کلمه‌ی جایزه» است</div></div>
    <div class="row"><b>۴</b><div style="flex:1">گیر کردی؟ از 💡 راهنما استفاده کن</div></div>
    <button class="big" style="width:100%;margin-top:8px" onclick="${manual ? 'closeModal()' : 'endTut()'}">${manual ? 'باشه' : 'بزن بریم!'}</button>`);
}
function endTut(){ S.tut = true; save(); closeModal(); if(dailyReady()) setTimeout(() => openDaily(false), 300); }

/* ============ شروع ============ */
applyTheme();
refresh();
Billing.init();
if(!S.tut) setTimeout(openTutorial, 300);
else if(dailyReady()) setTimeout(() => openDaily(false), 500);
</script>
